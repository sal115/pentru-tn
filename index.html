<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>SYNC_2026</title>
    <style>
        body { background: #000; margin: 0; overflow: hidden; font-family: 'Courier New', monospace; display: flex; align-items: center; justify-content: center; height: 100vh; }
        #terminal { width: 90%; max-width: 500px; color: #ff0055; z-index: 10; }
        input { background: transparent; border: none; color: #fff; font-family: inherit; font-size: 1.2rem; outline: none; width: 100%; border-bottom: 1px solid #333; padding: 5px 0; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #final-text { position: absolute; color: white; text-align: center; z-index: 20; display: none; pointer-events: none; text-shadow: 0 0 15px #ff0055; font-size: 1.8rem; bottom: 10%; }
    </style>
</head>
<body>

<div id="terminal">
    <div id="history"></div>
    <div id="input-area" style="margin-top: 20px;">
        <input type="text" id="user-input" placeholder="Răspunde aici..." autofocus autocomplete="off">
    </div>
</div>

<canvas id="heartCanvas"></canvas>
<div id="final-text">
    <h1 style="margin:0;">❤</h1>
    <p>Ești singurul meu <b>adevăr</b>.</p>
</div>

<script>
    const history = document.getElementById('history');
    const input = document.getElementById('user-input');
    const terminal = document.getElementById('terminal');
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');
    const finalText = document.getElementById('final-text');

    const quiz = [
        { q: "> IDENTIFICARE: Cine deține cheia amintirilor noastre?", a: "tu" },
        { q: "> ANALIZĂ: Cine ești pentru mine?", a: "tot" }
    ];

    let step = 0;
    function addLine(text) {
        const div = document.createElement('div');
        div.style.marginBottom = "10px";
        div.innerHTML = text;
        history.appendChild(div);
    }

    addLine(quiz[step].q);

    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const val = input.value.toLowerCase().trim();
            input.value = '';
            if (val === quiz[step].a) {
                step++;
                if (step < quiz.length) {
                    addLine("<span style='color:white'>> CONFIRMAT.</span>");
                    setTimeout(() => addLine(quiz[step].q), 500);
                } else {
                    startHeart();
                }
            } else {
                addLine("<span style='color:#444'>> REÎNCEARCĂ...</span>");
            }
        }
    });

    let particles = [];
    function startHeart() {
        terminal.style.display = 'none';
        finalText.style.display = 'block';
        resize();
        for (let i = 0; i < 2000; i++) particles.push(new Particle());
        animate();
    }

    window.addEventListener('resize', resize);
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    class Particle {
        constructor() {
            this.t = Math.random() * Math.PI * 2;
            this.update();
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 1.5 + 0.5;
            this.speed = Math.random() * 0.04 + 0.02;
        }
        update() {
            const b = 1 + 0.1 * Math.sin(Date.now() * 0.003);
            this.targetX = canvas.width / 2 + (16 * Math.pow(Math.sin(this.t), 3)) * (14 * b);
            this.targetY = canvas.height / 2 - (13 * Math.cos(this.t) - 5 * Math.cos(2 * this.t) - 2 * Math.cos(3 * this.t) - Math.cos(4 * this.t)) * (14 * b);
            this.x += (this.targetX - this.x) * this.speed;
            this.y += (this.targetY - this.y) * this.speed;
        }
        draw() {
            ctx.fillStyle = "#ff0055";
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function drawCat(x, y, mirrored, pulse) {
        ctx.save();
        ctx.translate(x, y);
        if (mirrored) ctx.scale(-1, 1);
        
        // Stil pisică: negru cu o mică aură roz ca să se vadă pe fundal negru
        ctx.fillStyle = "#000";
        ctx.strokeStyle = "#ff0055"; 
        ctx.lineWidth = 1;

        // Corp
        ctx.beginPath();
        ctx.ellipse(0, 0, 10, 18, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        
        // Cap
        ctx.beginPath();
        ctx.ellipse(0, -20, 8, 7, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        
        // Urechi
        ctx.beginPath();
        ctx.moveTo(-7, -23); ctx.lineTo(-4, -30); ctx.lineTo(-1, -24);
        ctx.fill(); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(7, -23); ctx.lineTo(4, -30); ctx.lineTo(1, -24);
        ctx.fill(); ctx.stroke();
        
        // Coadă animată
        ctx.beginPath();
        ctx.moveTo(-5, 10);
        ctx.quadraticCurveTo(-15 - pulse, 20, -10, 30);
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 4;
        ctx.lineCap = "round";
        ctx.stroke();
        // Contur coadă
        ctx.strokeStyle = "#ff0055";
        ctx.lineWidth = 1;
        ctx.stroke();
        
        ctx.restore();
    }

    function animate() {
        // Fundal semi-transparent pentru trail
        ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        particles.forEach(p => {
            p.update();
            p.draw();
        });

        // Desenăm pisicile după particule ca să fie deasupra
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2 + 40;
        const pulse = Math.sin(Date.now() * 0.003) * 5;

        drawCat(centerX - 12, centerY, false, pulse);
        drawCat(centerX + 12, centerY, true, pulse);

        requestAnimationFrame(animate);
    }
</script>
</body>
</html>
