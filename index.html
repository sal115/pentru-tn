<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNC_2026_ULTRA</title>
    <style>
        body { background: #000a1a; margin: 0; overflow: hidden; font-family: 'Courier New', monospace; display: flex; align-items: center; justify-content: center; height: 100vh; }
        
        /* Terminal mărit considerabil */
        #terminal { width: 95%; max-width: 900px; color: #ff0055; z-index: 10; padding: 20px; }
        #history { font-size: 2.2rem; line-height: 1.4; font-weight: bold; }
        input { background: transparent; border: none; color: #fff; font-family: inherit; font-size: 2.5rem; outline: none; width: 100%; border-bottom: 4px solid #ff0055; padding: 15px 0; margin-top: 20px; }
        
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        /* Text final uriaș */
        #final-text { 
            position: absolute; 
            color: white; 
            text-align: center; 
            z-index: 20; 
            display: none; 
            pointer-events: none; 
            text-shadow: 0 0 30px #ff0055; 
            width: 100%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        #final-text h1 { font-size: 8rem; margin: 0; }
        #final-text p { font-size: 3.5rem; margin-top: 20px; font-weight: bold; }
        b { color: #ff0055; text-transform: uppercase; }
    </style>
</head>
<body>

<div id="terminal">
    <div id="history"></div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="..." autofocus autocomplete="off">
    </div>
</div>

<canvas id="heartCanvas"></canvas>
<div id="final-text">
    <h1>❤</h1>
    <p>Ești singurul meu <b>adevăr</b>.</p>
</div>

<script>
    const history = document.getElementById('history');
    const input = document.getElementById('user-input');
    const terminal = document.getElementById('terminal');
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');
    const finalText = document.getElementById('final-text');

    const quiz = [
        { q: "> IDENTIFICARE: Cine deține cheia amintirilor noastre?", a: "tu" },
        { q: "> ANALIZĂ: Cine ești pentru mine?", a: "tot" }
    ];

    let step = 0;
    function addLine(text) {
        const div = document.createElement('div');
        div.style.marginBottom = "20px";
        div.innerHTML = text;
        history.appendChild(div);
        window.scrollTo(0, document.body.scrollHeight);
    }

    addLine(quiz[step].q);

    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const val = input.value.toLowerCase().trim();
            input.value = '';
            if (val === quiz[step].a) {
                step++;
                if (step < quiz.length) {
                    addLine("<span style='color:white'>> CONFIRMAT.</span>");
                    setTimeout(() => addLine(quiz[step].q), 500);
                } else {
                    startHeart();
                }
            } else {
                addLine("<span style='color:#444; font-size: 1.5rem;'>> EROARE: REÎNCEARCĂ...</span>");
            }
        }
    });

    let particles = [];
    function startHeart() {
        terminal.style.display = 'none';
        finalText.style.display = 'block';
        resize();
        for (let i = 0; i < 2500; i++) particles.push(new Particle());
        animate();
    }

    window.addEventListener('resize', resize);
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    class Particle {
        constructor() {
            this.t = Math.random() * Math.PI * 2;
            this.update();
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 3 + 1; 
            this.speed = Math.random() * 0.03 + 0.02;
        }
        update() {
            const b = 1 + 0.1 * Math.sin(Date.now() * 0.003);
            // Inimă uriașă adaptabilă la ecran
            const scale = Math.min(canvas.width, canvas.height) / 40;
            this.targetX = canvas.width / 2 + (16 * Math.pow(Math.sin(this.t), 3)) * (scale * b);
            this.targetY = canvas.height / 2 - (13 * Math.cos(this.t) - 5 * Math.cos(2 * this.t) - 2 * Math.cos(3 * this.t) - Math.cos(4 * this.t)) * (scale * b);
            this.x += (this.targetX - this.x) * this.speed;
            this.y += (this.targetY - this.y) * this.speed;
        }
        draw() {
            ctx.fillStyle = "#ff0055";
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function drawCat(x, y, mirrored, pulse) {
        ctx.save();
        ctx.translate(x, y);
        if (mirrored) ctx.scale(-1, 1);
        
        ctx.shadowBlur = 20;
        ctx.shadowColor = "#ff0055";
        ctx.fillStyle = "#000"; 
        ctx.strokeStyle = "#ff0055";
        ctx.lineWidth = 3;

        // Pisici masive
        ctx.beginPath();
        ctx.ellipse(0, 0, 25, 45, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        
        ctx.beginPath();
        ctx.ellipse(0, -50, 20, 18, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        
        ctx.beginPath();
        ctx.moveTo(-18, -55); ctx.lineTo(-10, -75); ctx.lineTo(-4, -60);
        ctx.fill(); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(18, -55); ctx.lineTo(10, -75); ctx.lineTo(4, -60);
        ctx.fill(); ctx.stroke();
        
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.moveTo(-15, 25);
        ctx.quadraticCurveTo(-40 - pulse*3, 50, -25, 80);
        ctx.strokeStyle = "#ff0055";
        ctx.lineWidth = 7;
        ctx.lineCap = "round";
        ctx.stroke();
        
        ctx.restore();
    }

    function animate() {
        ctx.fillStyle = 'rgba(0, 10, 26, 0.2)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        particles.forEach(p => {
            p.update();
            p.draw();
        });

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2 + 50; 
        const pulse = Math.sin(Date.now() * 0.003) * 5;

        drawCat(centerX - 35, centerY, false, pulse);
        drawCat(centerX + 35, centerY, true, pulse);

        requestAnimationFrame(animate);
    }
</script>
</body>
</html>
